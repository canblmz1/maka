name: PR 3434 current-main adaptation and verification

on:
  push:
    branches:
      - pr3434-sync-helper-20260903

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'canblmz1/maka'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolved PR head
        uses: actions/checkout@v4
        with:
          ref: fix/tool-execution-integrity
          fetch-depth: 0

      - name: Adapt stale repro harness imports to current main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts')
          text = path.read_text()

          old_imports = """import { createSessionEventMapMemory, mapSessionEventToRuntimeEvent } from '../ai-sdk-flow.js';
          import type { InvocationContext } from '../invocation-context.js';
          """
          new_imports = """import {
            createSessionEventMapMemory,
            mapSessionEventToRuntimeEvent,
          } from '../session-event-runtime-mapper.js';
          import type { RuntimeEventMapContext } from '../session-event-runtime-mapper.js';
          """
          if text.count(old_imports) != 1:
              raise SystemExit('expected exactly one stale mapper import block')
          text = text.replace(old_imports, new_imports, 1)

          pattern = re.compile(
              r"  const ctx: InvocationContext = \{.*?\n  \};\n  return \{",
              re.DOTALL,
          )
          replacement = """  const ctx: RuntimeEventMapContext = {
            sessionId: 'session-1',
            invocationId,
            runId,
            turnId,
            now: monotonicClock(),
          };
          return {"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one stale invocation context block, found {count}')

          path.write_text(text)
          PY

          git diff -- packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies with repository patches
        run: npm ci

      - name: Build runtime prerequisites
        run: |
          npm run build --workspace @maka/core
          npm run build --workspace @maka/storage
          npm run build --workspace @maka/mcp

      - name: Runtime typecheck and build
        run: |
          npm run typecheck --workspace @maka/runtime
          npm run build --workspace @maka/runtime

      - name: Focused tool-execution safety suites
        run: |
          node --test \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts
          node --test packages/runtime/src/__tests__/ai-sdk-backend.test.ts

      - name: Diff hygiene
        run: |
          git diff --check 01fe14bd271c38d65e82ce58d1448b10a5844a46
          npx biome lint \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts \
            packages/runtime/src/model-protocol.ts \
            packages/runtime/src/tool-call-execution-guard.ts \
            packages/runtime/src/tool-runtime.ts \
            packages/runtime/src/__tests__/ai-sdk-backend.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts
          npx biome format \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts \
            packages/runtime/src/model-protocol.ts \
            packages/runtime/src/tool-call-execution-guard.ts \
            packages/runtime/src/tool-runtime.ts \
            packages/runtime/src/__tests__/ai-sdk-backend.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts

      - name: Publish current-main compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts
          if git diff --cached --quiet; then
            echo 'No compatibility change to publish.'
            exit 0
          fi
          git commit -m 'test(runtime): adapt execution repro to current mapper'
          git push origin HEAD:fix/tool-execution-integrity