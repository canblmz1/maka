name: PR 3434 one-shot main sync

on:
  push:
    branches:
      - pr3434-sync-helper-20260903

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'canblmz1/maka'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper payload
        uses: actions/checkout@v4
        with:
          ref: pr3434-sync-helper-20260903
          path: helper
          fetch-depth: 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/tool-execution-integrity
          path: target
          fetch-depth: 0

      - name: Resolve pinned-main runtime conflicts and prove mergeability
        working-directory: target
        env:
          UPSTREAM_MAIN_SHA: 01fe14bd271c38d65e82ce58d1448b10a5844a46
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/apache/maka.git 2>/dev/null || true
          git fetch upstream "$UPSTREAM_MAIN_SHA"

          # Only the two files conflict. Start them from current main, then
          # reapply the reviewed PR behavior against current-main control flow.
          # This keeps the branch patch narrow and avoids pushing unrelated
          # upstream workflow-file changes with the Actions token.
          git checkout "$UPSTREAM_MAIN_SHA" -- \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts
          python ../helper/.github/pr3434-resolve.py
          git add packages/runtime/src/ai-sdk-backend.ts packages/runtime/src/model-adapter.ts

          git diff --check "$UPSTREAM_MAIN_SHA" -- \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts
          git status --short
          git commit -m 'chore: resolve current-main runtime conflicts'

          # Prove the resulting branch now merges current main with zero
          # conflicts before publishing the two-file resolution commit.
          set +e
          git merge --no-ff --no-commit "$UPSTREAM_MAIN_SHA"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo 'Conflict-resolution commit did not fully eliminate merge conflicts.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git merge --abort

          git push origin HEAD:fix/tool-execution-integrity