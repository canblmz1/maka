name: PR 3434 resolved-head verification

on:
  push:
    branches:
      - pr3434-sync-helper-20260903

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'canblmz1/maka'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolved PR head
        uses: actions/checkout@v4
        with:
          ref: fix/tool-execution-integrity
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies with repository patches
        run: npm ci

      - name: Build runtime prerequisites
        run: |
          npm run build --workspace @maka/core
          npm run build --workspace @maka/storage
          npm run build --workspace @maka/mcp

      - name: Runtime typecheck and build
        run: |
          npm run typecheck --workspace @maka/runtime
          npm run build --workspace @maka/runtime

      - name: Focused tool-execution safety suites
        run: |
          node --test \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts
          node --test packages/runtime/src/__tests__/ai-sdk-backend.test.ts

      - name: Diff hygiene
        run: |
          git diff --check 01fe14bd271c38d65e82ce58d1448b10a5844a46..HEAD
          npx biome lint \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts \
            packages/runtime/src/model-protocol.ts \
            packages/runtime/src/tool-call-execution-guard.ts \
            packages/runtime/src/tool-runtime.ts \
            packages/runtime/src/__tests__/ai-sdk-backend.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts
          npx biome format \
            packages/runtime/src/ai-sdk-backend.ts \
            packages/runtime/src/model-adapter.ts \
            packages/runtime/src/model-protocol.ts \
            packages/runtime/src/tool-call-execution-guard.ts \
            packages/runtime/src/tool-runtime.ts \
            packages/runtime/src/__tests__/ai-sdk-backend.test.ts \
            packages/runtime/src/__tests__/deferred-guard.test.ts \
            packages/runtime/src/__tests__/length-cutoff-tool-execution-repro.test.ts \
            packages/runtime/src/__tests__/tool-args-violation.test.ts \
            packages/runtime/src/__tests__/tool-call-execution-guard.test.ts